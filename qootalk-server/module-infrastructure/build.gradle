plugins {
    id 'java-test-fixtures'
}

dependencies {
	implementation project(':module-domain')
	implementation project(':module-application')
	implementation project(':module-common')
	
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Lombok
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// JUnit
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// TestContainers
	testImplementation "org.testcontainers:postgresql:1.19.8"
    testImplementation "org.testcontainers:junit-jupiter:1.19.8"
	testImplementation "org.testcontainers:localstack:1.19.8"

	// TestFixtures
	testFixturesImplementation 'org.testcontainers:postgresql:1.19.8'
    testFixturesImplementation 'org.testcontainers:junit-jupiter:1.19.8'
    testFixturesImplementation "org.testcontainers:localstack:1.19.8"
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'

	// AWS S3
	implementation 'software.amazon.awssdk:s3:2.41.13'
}

